apiVersion: apps/v1
kind: Deployment
metadata:
  name: vfl-api
  labels:
    app: vfl-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vfl-api
  template:
    metadata:
      labels:
        app: vfl-api
    spec:
      containers:
        - name: api
          image: vol-forecast-lab:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vfl-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: vfl-api
  labels:
    app: vfl-api
spec:
  type: NodePort
  selector:
    app: vfl-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
