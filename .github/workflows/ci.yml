name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = Lambda runtime; 3.14 = local development.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only torch (plain PyPI pulls the CUDA build on Linux)
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Ruff
        run: python -m pip install ruff==0.17.4
      - name: Lint critical errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run synthetic pipeline smoke test
        run: python scripts/smoke_run.py

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/budget, infra/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize local-only configuration
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag vol-forecast-lab:ci .
      - name: Check API health
        run: |
          set -euo pipefail
          docker run --detach --rm --name vfl-api -p 127.0.0.1:8000:8000 vol-forecast-lab:ci
          trap 'docker stop vfl-api >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs vfl-api
          exit 1

  dag-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import DAG files with Airflow
        env:
          AIRFLOW_VERSION: "3.4.0"
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          shopt -s nullglob
          dag_files=(dags/*.py)
          if ((${#dag_files[@]} == 0)); then
            echo "no DAGs yet"
            exit 0
          fi
          constraint_url="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          python -m pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${constraint_url}"
          python - <<'PY'
          from airflow.models import DagBag

          bag = DagBag(dag_folder="dags", include_examples=False)
          if bag.import_errors:
              details = "\n".join(f"{path}: {error}" for path, error in bag.import_errors.items())
              raise SystemExit(f"DAG import errors:\n{details}")
          print(f"Imported {len(bag.dags)} DAG(s)")
          PY

  k8s-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests when present
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(k8s/*.yaml)
          if ((${#manifests[@]} == 0)); then
            echo "no manifests yet"
            exit 0
          fi
          version="v1.37.1"
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl apply --dry-run=client -f k8s/
