name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = Lambda runtime; 3.14 = local development.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only torch (plain PyPI pulls the CUDA build on Linux)
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/budget, infra/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize local-only configuration
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate
